<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jarvis Browser</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ==========================================================
         NAVIGATION BAR
         ========================================================== -->

    <div id="nav">
      <!-- BACK -->
      <button id="backButton" type="button" title="Back" onclick="goBack()">
        <img class="icon" src="./icon/chevron-left.svg" alt="Back" />
      </button>

      <!-- FORWARD -->
      <button
        id="forwardButton"
        type="button"
        title="Forward"
        onclick="goForward()"
      >
        <img class="icon" src="./icon/chevron-right.svg" alt="Forward" />
      </button>

      <!-- RELOAD -->
      <button
        id="reloadButton"
        type="button"
        title="Reload"
        onclick="reloadPage()"
      >
        <img class="icon" src="./icon/refresh-cw.svg" alt="Reload" />
      </button>

      <!-- URL -->
      <div class="urlBlock">
        <img src="./icon/logo.svg" alt="Jarvis" />

        <input
          id="url"
          type="text"
          value="https://example.com"
          autocomplete="off"
          spellcheck="false"
          aria-label="Address"
        />
      </div>

      <!-- NAVIGATE -->
      <button
        id="navigateButton"
        type="button"
        title="Navigate"
        onclick="navigate()"
      >
        <img class="icon" src="./icon/send.svg" alt="Navigate" />
      </button>
    </div>

    <!-- ==========================================================
         MAIN LAYOUT
         ========================================================== -->

    <div id="layout">
      <!-- ========================================================
           BROWSER
           ======================================================== -->

      <div id="browser"></div>

      <!-- ========================================================
           AI VISUAL AREA
           ======================================================== -->

      <div id="ai">
        <div class="animation">
          <div class="animationLayerColor"></div>

          <div class="animationLayer"></div>
        </div>
      </div>

      <!-- ========================================================
           AI COMMAND PANEL
           ======================================================== -->

      <div id="aiForm">
        <form
          id="ai-form"
          autocomplete="off"
          onsubmit="
            event.preventDefault();
            return false;
          "
        >
          <div class="statusBlock">
            <img src="./icon/logo.svg" alt="Jarvis" />

            <p id="statusText">
              Limit your availability to create exclusivity...
            </p>
          </div>

          <div class="cmd-box">
            <textarea
              id="cmd"
              placeholder="Type command (e.g. 'get data from .tzQn0o' or 'watch data from .tzQn0o every 5s'). Press Enter or click Send..."
              rows="3"
              autocomplete="off"
              spellcheck="false"
            ></textarea>
            <button
              id="submitCmdBtn"
              type="button"
              class="cmd-send-btn"
              title="Send Command"
            >
              <img src="./icon/send.svg" alt="Send" />
            </button>
          </div>
        </form>

        <div id="panelTabs" class="panel-tabs">
          <button id="tabLogsBtn" type="button" class="tab-btn active">
            💬 Jarvis Logs
          </button>
          <button id="tabFirebaseBtn" type="button" class="tab-btn">
            🔥 Firebase 4-Values Board
            <span id="badgeTotalCount" class="tab-badge">0</span>
          </button>
        </div>

        <div id="logs" class="panel-view active"></div>
      </div>
    </div>
    <div id="firebaseBoard" class="panel-view" style="display: none">
      <div class="fb-board-header">
        <div class="fb-board-title">
          <span class="fb-live-dot"></span>
          <strong>Firestore: Bio_sic</strong>
          <span id="fbActiveDateBadge" class="fb-badge date-badge">Today</span>
        </div>
        <div class="fb-board-controls">
          <select
            id="fbIndexSelect"
            class="fb-select"
            title="Select 90-Count Chunk Index"
          >
            <option value="all">All Indexes (0..n)</option>
            <option value="0" selected>Index 0 (Max 90)</option>
          </select>
          <button id="fbRefreshBtn" type="button" class="fb-btn">
            🔄 Sync Firebase
          </button>
          <button id="fbAutoSyncBtn" type="button" class="fb-btn active">
            ⚡ Auto-Sync (5s)
          </button>
          <button id="fbDismissPopupBtn" type="button" class="fb-btn">
            🛡 Dismiss Popup
          </button>
        </div>
      </div>

      <div class="fb-stats-strip">
        <span class="fb-stat" id="fbStatTotal">📊 Total Items: 0</span>
        <span class="fb-stat" id="fbStatIndex">📁 Active Index: 0 (0/90)</span>
        <span class="fb-stat highlight" id="fbStatGuard"
          >🛡 Inactivity Guard: ACTIVE</span
        >
        <span class="fb-stat" id="fbStatLastSync">⏱ Last Sync: --</span>
      </div>

      <!-- Horizontal scrollable container for vertical 4-values columns -->
      <div id="fbColumnsContainer" class="fb-columns-container">
        <div class="fb-empty-state">
          No Firestore round data loaded yet. Click "Sync Firebase" or start
          watching data.
        </div>
      </div>
    </div>
    <!-- ==========================================================
         JARVIS CORE
         ========================================================== -->

    <script>
      // ==========================================================
      // GLOBAL STATE
      // ==========================================================

      window.aiState = {
        ready: false,

        pendingCommand: null,

        backendReady: false,

        initialized: false,

        initializing: false,

        navigating: false,

        currentUrl: "",

        lastError: null,

        backendUrl: "http://localhost:9000",

        startedAt: Date.now(),
      };

      // ==========================================================
      // CONFIGURATION
      // ==========================================================

      const BACKEND_URL = "http://localhost:9000";

      const BACKEND_HEALTH_URL = `${BACKEND_URL}/status`;

      const BACKEND_TIMEOUT = 10000;

      const BACKEND_MAX_ATTEMPTS = 30;

      const BACKEND_RETRY_DELAY = 500;

      // ==========================================================
      // DOM HELPERS
      // ==========================================================

      function $(id) {
        return document.getElementById(id);
      }

      // ==========================================================
      // LOGGING
      // ==========================================================

      function log(message) {
        const text =
          message === undefined || message === null ? "" : String(message);

        console.log("[Jarvis]", text);

        const logs = $("logs");

        if (!logs) {
          return;
        }

        const div = document.createElement("div");

        div.innerText = text;

        logs.appendChild(div);

        logs.scrollTop = logs.scrollHeight;
      }

      // ==========================================================
      // STATUS
      // ==========================================================

      function setStatus(message) {
        const status = $("statusText");

        if (status) {
          status.innerText = String(message || "");
        }
      }

      // ==========================================================
      // ERROR HANDLING
      // ==========================================================

      function setError(error) {
        const message = error?.message || String(error || "Unknown error");

        window.aiState.lastError = message;

        console.error("[Jarvis Error]", message);

        log(`❌ ${message}`);

        setStatus("Jarvis encountered an error");
      }

      // ==========================================================
      // URL FORMATTER
      // ==========================================================

      function formatURL(value) {
        let url = String(value || "").trim();

        if (!url) {
          return "https://google.com";
        }

        //--------------------------------------------------------
        // Already valid HTTP/HTTPS
        //--------------------------------------------------------

        if (/^https?:\/\//i.test(url)) {
          return url;
        }

        //--------------------------------------------------------
        // Localhost / IP / file-like URLs
        //--------------------------------------------------------

        if (
          /^localhost(?::\d+)?(?:\/|$)/i.test(url) ||
          /^\d{1,3}(?:\.\d{1,3}){3}(?::\d+)?(?:\/|$)/.test(url)
        ) {
          return `http://${url}`;
        }

        //--------------------------------------------------------
        // Search-like input
        //--------------------------------------------------------

        if (/\s/.test(url) || !url.includes(".")) {
          return `https://www.google.com/search?q=${encodeURIComponent(url)}`;
        }

        //--------------------------------------------------------
        // Normal domain
        //--------------------------------------------------------

        return `https://${url}`;
      }

      // ==========================================================
      // CHECK BROWSER API
      // ==========================================================

      function ensureBrowserAPI() {
        if (!window.browserAPI) {
          throw new Error("Electron browserAPI is not available");
        }

        return window.browserAPI;
      }

      // ==========================================================
      // CHECK FUNCTION
      // ==========================================================

      function hasBrowserFunction(name) {
        return (
          window.browserAPI && typeof window.browserAPI[name] === "function"
        );
      }

      // ==========================================================
      // GENERIC TIMEOUT
      // ==========================================================

      async function fetchWithTimeout(
        url,
        options = {},
        timeout = BACKEND_TIMEOUT,
      ) {
        const controller = new AbortController();

        const timer = setTimeout(() => controller.abort(), timeout);

        try {
          return await fetch(url, {
            ...options,
            signal: controller.signal,
          });
        } finally {
          clearTimeout(timer);
        }
      }

      // ==========================================================
      // BACKEND HEALTH CHECK
      // ==========================================================

      async function checkBackend() {
        try {
          const response = await fetchWithTimeout(BACKEND_HEALTH_URL, {
            method: "GET",
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error(`Backend returned HTTP ${response.status}`);
          }

          window.aiState.backendReady = true;

          return true;
        } catch (error) {
          window.aiState.backendReady = false;

          return false;
        }
      }

      // ==========================================================
      // WAIT FOR BACKEND
      // ==========================================================

      async function waitForBackend(
        maxAttempts = BACKEND_MAX_ATTEMPTS,
        retryDelay = BACKEND_RETRY_DELAY,
      ) {
        if (window.aiState.backendReady) {
          return true;
        }

        log("⏳ Connecting to Jarvis backend...");

        setStatus("Connecting to Jarvis backend...");

        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          const available = await checkBackend();

          if (available) {
            log("✅ Jarvis backend connected");

            setStatus("Jarvis backend connected");

            return true;
          }

          console.warn(
            `Backend connection attempt ${attempt}/${maxAttempts} failed`,
          );

          if (attempt < maxAttempts) {
            await new Promise((resolve) => setTimeout(resolve, retryDelay));
          }
        }

        window.aiState.backendReady = false;

        setStatus("Backend unavailable");

        log("❌ Unable to connect to Jarvis backend");

        return false;
      }

      // ==========================================================
      // BACKEND REQUEST HELPER
      // ==========================================================

      async function backendFetch(endpoint, options = {}) {
        //--------------------------------------------------------
        // Ensure backend
        //--------------------------------------------------------

        if (!window.aiState.backendReady) {
          const connected = await waitForBackend();

          if (!connected) {
            throw new Error("Jarvis backend is unavailable");
          }
        }

        //--------------------------------------------------------
        // Request
        //--------------------------------------------------------

        const response = await fetchWithTimeout(`${BACKEND_URL}${endpoint}`, {
          ...options,

          headers: {
            "Content-Type": "application/json",

            ...(options.headers || {}),
          },
        });

        //--------------------------------------------------------
        // Backend failure
        //--------------------------------------------------------

        if (!response.ok) {
          let message = `Backend request failed: ${response.status} ${response.statusText}`;

          try {
            const errorData = await response.clone().json();

            if (errorData?.error) {
              message = errorData.error;
            }
          } catch {
            // Ignore non-JSON error response
          }

          throw new Error(message);
        }

        return response;
      }

      // ==========================================================
      // NAVIGATE
      // ==========================================================

      async function navigate(providedUrl = null) {
        if (window.aiState.navigating) {
          log("⏳ Navigation already in progress...");

          return false;
        }

        window.aiState.navigating = true;

        try {
          //------------------------------------------------------
          // URL
          //------------------------------------------------------

          const input = $("url");

          if (!input) {
            throw new Error("URL input element not found");
          }

          const rawUrl = providedUrl !== null ? providedUrl : input.value;

          const url = formatURL(rawUrl);

          input.value = url;

          window.aiState.currentUrl = url;

          //------------------------------------------------------
          // Browser API
          //------------------------------------------------------

          const browser = ensureBrowserAPI();

          log(`🌐 Navigating to ${url}`);

          setStatus(`Opening ${url}`);

          //------------------------------------------------------
          // Electron browser
          //------------------------------------------------------

          if (typeof browser.navigate !== "function") {
            throw new Error("browserAPI.navigate() is not available");
          }

          await browser.navigate(url);

          //------------------------------------------------------
          // Backend
          //------------------------------------------------------

          if (!window.aiState.backendReady) {
            await waitForBackend(10, 300);
          }

          if (window.aiState.backendReady) {
            try {
              await backendFetch("/navigate", {
                method: "POST",

                body: JSON.stringify({
                  url,
                }),
              });
            } catch (backendError) {
              console.warn(
                "Backend navigation synchronization failed:",
                backendError.message,
              );

              log(
                `⚠️ Browser opened, backend sync failed: ${backendError.message}`,
              );
            }
          }

          //------------------------------------------------------
          // Success
          //------------------------------------------------------

          setStatus("Jarvis Browser is ready");

          log(`✅ Navigation completed: ${url}`);

          return true;
        } catch (error) {
          setError(error);

          log(`❌ Navigation failed: ${error.message}`);

          return false;
        } finally {
          window.aiState.navigating = false;
        }
      }

      // ==========================================================
      // BACK
      // ==========================================================

      async function goBack() {
        try {
          const browser = ensureBrowserAPI();

          if (typeof browser.back !== "function") {
            throw new Error("browserAPI.back() is not available");
          }

          await browser.back();

          log("↩️ Back");
        } catch (error) {
          setError(error);

          log(`❌ Back failed: ${error.message}`);
        }
      }

      // ==========================================================
      // FORWARD
      // ==========================================================

      async function goForward() {
        try {
          const browser = ensureBrowserAPI();

          if (typeof browser.forward !== "function") {
            throw new Error("browserAPI.forward() is not available");
          }

          await browser.forward();

          log("↪️ Forward");
        } catch (error) {
          setError(error);

          log(`❌ Forward failed: ${error.message}`);
        }
      }

      // ==========================================================
      // RELOAD
      // ==========================================================

      async function reloadPage() {
        try {
          const browser = ensureBrowserAPI();

          if (typeof browser.reload !== "function") {
            throw new Error("browserAPI.reload() is not available");
          }

          await browser.reload();

          log("🔄 Page reloaded");
        } catch (error) {
          setError(error);

          log(`❌ Reload failed: ${error.message}`);
        }
      }

      // ==========================================================
      // RESIZE BROWSER
      // ==========================================================

      function resizeBrowser() {
        try {
          if (
            window.electronAPI &&
            typeof window.electronAPI.resizeBrowser === "function"
          ) {
            window.electronAPI.resizeBrowser();

            return true;
          }

          //------------------------------------------------------
          // Optional browserAPI resize
          //------------------------------------------------------

          if (
            window.browserAPI &&
            typeof window.browserAPI.resize === "function"
          ) {
            window.browserAPI.resize();

            return true;
          }

          return false;
        } catch (error) {
          console.error("❌ Browser resize failed:", error);

          return false;
        }
      }

      // ==========================================================
      // SYNC URL FROM ELECTRON
      // ==========================================================

      function setupURLSynchronization() {
        //--------------------------------------------------------
        // Optional preload event
        //--------------------------------------------------------

        if (
          window.browserAPI &&
          typeof window.browserAPI.onURLChanged === "function"
        ) {
          window.browserAPI.onURLChanged((url) => {
            if (!url) {
              return;
            }

            const input = $("url");

            if (input) {
              input.value = String(url);
            }

            window.aiState.currentUrl = String(url);
          });

          log("🔗 URL synchronization enabled");
        }

        //--------------------------------------------------------
        // Optional Electron event
        //--------------------------------------------------------

        if (
          window.electronAPI &&
          typeof window.electronAPI.onURLChanged === "function"
        ) {
          window.electronAPI.onURLChanged((url) => {
            if (!url) {
              return;
            }

            const input = $("url");

            if (input) {
              input.value = String(url);
            }

            window.aiState.currentUrl = String(url);
          });
        }
      }

      // ==========================================================
      // INITIALIZE JARVIS
      // ==========================================================

      async function initializeJarvis() {
        //--------------------------------------------------------
        // Already initialized
        //--------------------------------------------------------

        if (window.aiState.initialized) {
          console.log("ℹ️ Jarvis is already initialized");

          return true;
        }

        //--------------------------------------------------------
        // Already initializing
        //--------------------------------------------------------

        if (window.aiState.initializing) {
          console.log("ℹ️ Jarvis initialization already running");

          return false;
        }

        window.aiState.initializing = true;

        try {
          log("🚀 Starting Jarvis Browser...");

          setStatus("Starting Jarvis Browser...");

          //------------------------------------------------------
          // STEP 1
          // Browser API
          //------------------------------------------------------

          if (!window.browserAPI) {
            throw new Error("Electron browserAPI is not available");
          }

          //------------------------------------------------------
          // STEP 2
          // Backend
          //------------------------------------------------------

          const backendReady = await waitForBackend();

          if (!backendReady) {
            throw new Error("Jarvis backend could not be reached");
          }

          //------------------------------------------------------
          // STEP 3
          // URL
          //------------------------------------------------------

          const input = $("url");

          if (!input) {
            throw new Error("URL input element not found");
          }

          const url = formatURL(input.value);

          input.value = url;

          window.aiState.currentUrl = url;

          //------------------------------------------------------
          // STEP 4
          // Browser navigation
          //------------------------------------------------------

          log(`🌐 Opening ${url}`);

          setStatus(`Opening ${url}`);

          const browser = ensureBrowserAPI();

          if (typeof browser.navigate !== "function") {
            throw new Error("browserAPI.navigate() is not available");
          }

          await browser.navigate(url);

          //------------------------------------------------------
          // STEP 5
          // Backend initialization
          //------------------------------------------------------

          log("🔌 Initializing browser automation...");

          setStatus("Initializing browser automation...");

          const response = await backendFetch("/init", {
            method: "POST",

            body: JSON.stringify({
              url,
            }),
          });

          let data = null;

          try {
            data = await response.json();
          } catch {
            data = {
              success: true,
            };
          }

          //------------------------------------------------------
          // Backend explicitly rejected initialization
          //------------------------------------------------------

          if (data && data.success === false) {
            throw new Error(data.error || "Backend initialization failed");
          }

          //------------------------------------------------------
          // STEP 6
          // State
          //------------------------------------------------------

          window.aiState.ready = true;

          window.aiState.initialized = true;

          window.aiState.backendReady = true;

          window.aiState.lastError = null;

          //------------------------------------------------------
          // STEP 7
          // Final status
          //------------------------------------------------------

          setStatus("Jarvis Browser is ready");

          log("✅ Jarvis Browser is ready");

          console.log("✅ Jarvis initialization complete", data);

          return true;
        } catch (error) {
          window.aiState.ready = false;

          window.aiState.initialized = false;

          window.aiState.lastError = error?.message || String(error);

          console.error("❌ Jarvis initialization failed:", error);

          log(`❌ Jarvis startup failed: ${error.message}`);

          setStatus("Jarvis startup failed");

          return false;
        } finally {
          window.aiState.initializing = false;
        }
      }

      // ==========================================================
      // ENSURE JARVIS READY
      // ==========================================================

      async function ensureJarvisReady() {
        if (window.aiState.ready && window.aiState.initialized) {
          return true;
        }

        return await initializeJarvis();
      }

      // ==========================================================
      // BROWSER RESIZE OBSERVER
      // ==========================================================

      function setupBrowserResizeObserver() {
        const browserDiv = $("browser");

        if (!browserDiv || !window.ResizeObserver) {
          return;
        }

        const observer = new ResizeObserver(() => {
          resizeBrowser();
        });

        observer.observe(browserDiv);

        window.jarvisResizeObserver = observer;
      }

      // ==========================================================
      // URL INPUT ENTER
      // ==========================================================

      function setupURLInput() {
        const input = $("url");

        if (!input) {
          return;
        }

        input.addEventListener("keydown", async (event) => {
          if (event.key !== "Enter") {
            return;
          }

          event.preventDefault();

          await navigate();
        });

        //--------------------------------------------------------
        // Focus select
        //--------------------------------------------------------

        input.addEventListener("focus", () => {
          input.select();
        });
      }

      // ==========================================================
      // AI COMMAND INPUT
      //
      // ai.js owns actual AI command processing.
      // We only protect readiness here.
      // ==========================================================

      function setupAIFormGuard() {
        const form = document.getElementById("ai-form");
        const cmdInput = document.getElementById("cmd");
        const submitBtn = document.getElementById("submitCmdBtn");

        if (!form) {
          console.error("ai-form not found");
          return;
        }

        async function submitAICommand(event) {
          if (event) {
            event.preventDefault();
            event.stopPropagation();
          }

          const val = cmdInput ? cmdInput.value.trim() : "";
          if (!val) return;

          if (cmdInput) cmdInput.value = "";

          const getHandler = () =>
            typeof window.handleAISubmit === "function"
              ? window.handleAISubmit
              : typeof window.executeUserCommand === "function"
                ? window.executeUserCommand
                : null;

          const handler = getHandler();
          if (handler) {
            try {
              await handler(val);
            } catch (err) {
              console.error("AI submit error:", err);
              if (typeof log === "function") log(`❌ AI Error: ${err.message}`);
            }
          } else {
            console.log("Waiting for AI handler to initialize...");
            let retries = 0;
            const timer = setInterval(async () => {
              retries++;
              const retryHandler = getHandler();
              if (retryHandler) {
                clearInterval(timer);
                try {
                  await retryHandler(val);
                } catch (err) {
                  console.error("AI submit error:", err);
                  if (typeof log === "function")
                    log(`❌ AI Error: ${err.message}`);
                }
              } else if (retries >= 15) {
                clearInterval(timer);
                console.error("AI submit handler not found");
                if (typeof log === "function")
                  log("❌ AI submit handler not ready. Please try again.");
                if (cmdInput && !cmdInput.value) cmdInput.value = val;
              }
            }, 100);
          }
        }

        form.addEventListener("submit", submitAICommand, true);

        if (submitBtn) {
          submitBtn.addEventListener("click", submitAICommand);
        }

        if (cmdInput) {
          cmdInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              e.stopPropagation();
              submitAICommand(e);
            }
          });
        }
      }

      // Initialize form guard as early as possible
      setupAIFormGuard();
      // ==========================================================
      // INITIAL PAGE LOAD
      // ==========================================================

      window.addEventListener(
        "load",
        async () => {
          try {
            log("🚀 Jarvis Browser loading...");

            //------------------------------------------------------
            // Resize
            //------------------------------------------------------

            resizeBrowser();

            //------------------------------------------------------
            // Resize observer
            //------------------------------------------------------

            setupBrowserResizeObserver();

            //------------------------------------------------------
            // URL input
            //------------------------------------------------------

            setupURLInput();

            //------------------------------------------------------
            // URL synchronization
            //------------------------------------------------------

            setupURLSynchronization();

            //------------------------------------------------------
            // AI form guard
            //------------------------------------------------------

            setupAIFormGuard();

            //------------------------------------------------------
            // Initialize
            //------------------------------------------------------

            await initializeJarvis();
          } catch (error) {
            console.error("❌ Page initialization failed:", error);

            log(`❌ Page initialization failed: ${error.message}`);
          }
        },
        {
          once: true,
        },
      );

      // ==========================================================
      // WINDOW RESIZE
      // ==========================================================

      window.addEventListener("resize", () => {
        resizeBrowser();
      });

      // ==========================================================
      // EXPOSE NAVIGATION FUNCTIONS
      // ==========================================================

      window.navigate = navigate;

      window.goBack = goBack;

      window.goForward = goForward;

      window.reloadPage = reloadPage;

      // ==========================================================
      // JARVIS DEBUG / CONTROL API
      // ==========================================================

      window.jarvis = {
        //--------------------------------------------------------
        // State
        //--------------------------------------------------------

        state: window.aiState,

        //--------------------------------------------------------
        // Backend
        //--------------------------------------------------------

        async checkBackend() {
          const available = await checkBackend();

          return {
            success: available,

            message: available
              ? "Backend is available"
              : "Backend is unavailable",
          };
        },

        //--------------------------------------------------------
        // Initialize
        //--------------------------------------------------------

        async initialize() {
          return await initializeJarvis();
        },

        //--------------------------------------------------------
        // Ensure ready
        //--------------------------------------------------------

        async ready() {
          return await ensureJarvisReady();
        },

        //--------------------------------------------------------
        // Navigate
        //--------------------------------------------------------

        async navigate(url) {
          return await navigate(url);
        },

        //--------------------------------------------------------
        // Back
        //--------------------------------------------------------

        async back() {
          return await goBack();
        },

        //--------------------------------------------------------
        // Forward
        //--------------------------------------------------------

        async forward() {
          return await goForward();
        },

        //--------------------------------------------------------
        // Reload
        //--------------------------------------------------------

        async reload() {
          return await reloadPage();
        },

        //--------------------------------------------------------
        // Resize
        //--------------------------------------------------------

        resize() {
          return resizeBrowser();
        },

        //--------------------------------------------------------
        // Backend request
        //--------------------------------------------------------

        async backend(endpoint, options = {}) {
          const response = await backendFetch(endpoint, options);

          const contentType = response.headers.get("content-type") || "";

          if (contentType.includes("application/json")) {
            return await response.json();
          }

          return await response.text();
        },

        //--------------------------------------------------------
        // Diagnostics
        //--------------------------------------------------------

        diagnostics() {
          return {
            state: {
              ...window.aiState,
            },

            browserAPI: !!window.browserAPI,

            electronAPI: !!window.electronAPI,

            backend: BACKEND_URL,

            browserFunctions: {
              navigate: hasBrowserFunction("navigate"),

              back: hasBrowserFunction("back"),

              forward: hasBrowserFunction("forward"),

              reload: hasBrowserFunction("reload"),

              resize: hasBrowserFunction("resize"),

              onURLChanged: hasBrowserFunction("onURLChanged"),
            },

            uptime: Date.now() - window.aiState.startedAt,
          };
        },
      };

      // ==========================================================
      // GLOBAL DEBUG
      // ==========================================================

      console.log("==================================================");

      console.log("Jarvis Browser Frontend");

      console.log("Backend:", BACKEND_URL);

      console.log("==================================================");
    </script>

    <script src="ai.js"></script>
